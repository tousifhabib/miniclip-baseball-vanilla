[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

# The build that goes into the app: slower to make, smaller and a little
# faster to run.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
